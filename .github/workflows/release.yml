name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (required for Trusted Publishing OIDC)
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci

      - name: Build Distributables
        run: npm run build

      - name: Run Typecheck and Tests
        run: |
          npm run typecheck
          npm run test

      - name: Publish Packages via npm Trusted Publishing (OIDC)
        run: |
          npm publish --workspace=@zorveus/sdk --access public --provenance
          npm publish --workspace=@zorveus/react --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
